<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locale Storage, DOM, EventListener</title>
    <style>
      body {
        margin: 30px;
      }
      code {
        display: block;
        margin: 20px;
      }
      button {
        border-radius: 10px;
        box-shadow: 5px 5px 10px gray;
      }
      #btn4 {
        background-color: crimson;
        box-shadow: 5px 5px 10px gray;
        padding: 5px;
      }
      #btn4:hover {
        background-color: rgb(135, 11, 36);
      }
      button:not(#btn4):hover {
        background-color: cadetblue;
      }
    </style>
  </head>
  <body>
    <h3>Open the Console log for outputs</h3>
    <p>'Right Click + Inspect' OR 'F12'. Then go to Console tab</p>
    <h3>Locale Storage</h3>
    <code>
      The best way to store user based information as temporarly (cache) or
      permanently (localeStorage) on browser with
      <em>WEB API</em> structure. working as key-value pairs
    </code>
    <p>
      <em>DO NOT FORGET TO CLEAR STORAGE</em>
    </p>

    <div>
      <button id="btn1">See the User Name (key is "username")</button>
      <p id="user"></p>
    </div>

    <div>
      <button id="btn2">See the all Locale Storage</button>
      <p id="all"></p>
    </div>

    <div>
      <button id="btn3">Add / Change item</button>
      <p id="all"></p>
    </div>

    <div>
      <button id="btn4">Clear Locale Storage</button>
      <p id="all"></p>
    </div>

    <script src="./work14.js"></script>
  </body>
</html>
