<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SetTimeInterval, SetTimeOut</title>
    <style>
      body {
        margin: 30px;
      }
    </style>
  </head>
  <body>
    <h3>Open the Console log for outputs</h3>
    <p>'Right Click + Inspect' OR 'F12'. Then go to Console tab</p>
    <h2>SetTimeOut</h2>
    <p>Works after specified duration at once and stops</p>
    <code>setTimeOut(function, milliseconds)</code>
    <h2>SetTimeInterval</h2>
    <p>Works repeatly within determined time durations</p>
    <code>setTimeInterval(function,milliseconds)</code>
    <script src="./work9.js"></script>
  </body>
</html>
